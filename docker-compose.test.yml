name: clubhub-tests

services:
  postgres:
    image: postgres:18
    env_file: .env.test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    env_file: .env.test
    command:
      - /bin/sh
      - -c
      - |
        exec redis-server \
          --save "" \
          --appendonly no \
          --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-test-data:
